<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>꼬마 비행기의 무지개 하늘 여행</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Jua', sans-serif;
            background: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%);
            touch-action: none;
            user-select: none;
        }
        .game-shadow {
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }
        /* Bounce and float animations */
        @keyframes floatSlow {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }
        .floating {
            animation: floatSlow 2s ease-in-out infinite;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen m-0 p-2 overflow-hidden">

    <header class="text-center mb-2">
        <h1 class="text-3xl md:text-4xl text-pink-500 drop-shadow-md tracking-wider">✈️ 꼬마 비행기의 무지개 모험 🌈</h1>
        <p class="text-gray-600 text-sm md:text-base">별과 과일을 모아봐요! (방향키 또는 마우스/터치 조작)</p>
    </header>

    <div class="relative rounded-3xl overflow-hidden border-4 border-white game-shadow bg-sky-200">
        <canvas id="gameCanvas" width="450" height="650" class="block w-full max-w-[450px] h-auto cursor-pointer"></canvas>
        
        <!-- Overlay for Start / Pause / Game Over Screen -->
        <div id="uiOverlay" class="absolute inset-0 bg-black/30 backdrop-blur-xs flex flex-col items-center justify-center text-white p-6 text-center transition-all">
            <div id="menuContent" class="bg-white/90 text-gray-800 p-6 rounded-3xl game-shadow max-w-xs w-full">
                <h2 id="menuTitle" class="text-2xl text-pink-500 mb-2">하늘 여행 출발!</h2>
                <p id="menuDesc" class="text-sm text-gray-600 mb-4">알록달록한 별과 과일을 모으며 구름을 피해 날아보세요.</p>
                <button id="actionBtn" class="w-full bg-gradient-to-r from-pink-400 to-yellow-400 hover:from-pink-500 hover:to-yellow-500 text-white font-bold py-3 px-6 rounded-2xl shadow-lg text-lg transition-transform active:scale-95 cursor-pointer">
                    게임 시작! 🚀
                </button>
            </div>
        </div>
    </div>

    <div class="mt-3 flex gap-4 md:hidden">
        <button id="btnShield" class="bg-yellow-400 text-white px-4 py-2 rounded-xl font-bold shadow-md active:scale-90">🛡️ 버블 방패</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const uiOverlay = document.getElementById('uiOverlay');
        const menuContent = document.getElementById('menuContent');
        const menuTitle = document.getElementById('menuTitle');
        const menuDesc = document.getElementById('menuDesc');
        const actionBtn = document.getElementById('actionBtn');

        // Game State Variables
        let gameState = 'START'; // START, PLAYING, GAMEOVER
        let score = 0;
        let fruitCount = 0;
        let shieldActive = false;
        let shieldTimer = 0;
        let particles = [];
        let floatTexts = [];

        // Player (Cute Little Plane)
        let player = {
            x: 225,
            y: 540,
            radius: 26,
            speed: 6,
            targetX: 225,
            targetY: 540,
            isDragging: false
        };

        // Collections & Entities
        let stars = [];
        let fruits = [];
        let clouds = [];
        let friendlyBirds = [];

        // Input Tracking
        let keys = {};
        window.addEventListener('keydown', (e) => {
            keys[e.code] = true;
            if (e.code === 'Space' && gameState === 'PLAYING') activateShield();
        });
        window.addEventListener('keyup', (e) => { keys[e.code] = false; });

        // Mouse & Touch Controls
        canvas.addEventListener('pointerdown', (e) => {
            if (gameState !== 'PLAYING') return;
            player.isDragging = true;
            updateTouchPosition(e);
        });

        canvas.addEventListener('pointermove', (e) => {
            if (player.isDragging && gameState === 'PLAYING') {
                updateTouchPosition(e);
            }
        });

        canvas.addEventListener('pointerup', () => { player.isDragging = false; });
        canvas.addEventListener('pointercancel', () => { player.isDragging = false; });

        function updateTouchPosition(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            player.targetX = (e.clientX - rect.left) * scaleX;
            player.targetY = (e.clientY - rect.top) * scaleY;
        }

        document.getElementById('btnShield').addEventListener('click', () => {
            if (gameState === 'PLAYING') activateShield();
        });

        function activateShield() {
            if (!shieldActive) {
                shieldActive = true;
                shieldTimer = 300; // ~5 seconds at 60fps
                addFloatText("✨ 버블 방패 ON!", player.x, player.y - 30, "#38bdf8");
            }
        }

        function startGame() {
            score = 0;
            fruitCount = 0;
            stars = [];
            fruits = [];
            clouds = [];
            friendlyBirds = [];
            particles = [];
            floatTexts = [];
            player.x = canvas.width / 2;
            player.y = 540;
            player.targetX = player.x;
            player.targetY = player.y;
            shieldActive = false;
            shieldTimer = 0;
            
            gameState = 'PLAYING';
            uiOverlay.style.display = 'none';
        }

        function triggerGameOver() {
            gameState = 'GAMEOVER';
            uiOverlay.style.display = 'flex';
            menuTitle.innerHTML = "✨ 모험 끝! 수고했어요 ✨";
            menuDesc.innerHTML = `모은 별: <b>${score}개</b> | 모은 과일: <b>${fruitCount}개</b>`;
            actionBtn.innerHTML = "다시 모험하기 🚀";
        }

        actionBtn.addEventListener('click', startGame);

        // Spawner Intervals
        setInterval(() => {
            if (gameState !== 'PLAYING') return;
            // Spawn Star
            stars.push({
                x: Math.random() * (canvas.width - 60) + 30,
                y: -30,
                size: 18 + Math.random() * 8,
                speed: 2 + Math.random() * 1.5,
                angle: Math.random() * Math.PI
            });
        }, 800);

        setInterval(() => {
            if (gameState !== 'PLAYING') return;
            // Spawn Fruit (Apple, Strawberry, Banana emojis or shapes)
            const types = ['🍎', '🍓', '🍌', '🍑'];
            fruits.push({
                x: Math.random() * (canvas.width - 60) + 30,
                y: -30,
                type: types[Math.floor(Math.random() * types.length)],
                speed: 1.8 + Math.random() * 1,
                wobble: Math.random() * 2
            });
        }, 2200);

        setInterval(() => {
            if (gameState !== 'PLAYING') return;
            // Spawn Cloud obstacles (Friendly white soft clouds)
            clouds.push({
                x: Math.random() * (canvas.width - 80) + 40,
                y: -60,
                radius: 35 + Math.random() * 20,
                speed: 1.2 + Math.random() * 0.8
            });
        }, 1500);

        function update() {
            if (gameState !== 'PLAYING') return;

            // Keyboard movement
            if (keys['ArrowLeft'] || keys['KeyA']) player.x -= player.speed;
            if (keys['ArrowRight'] || keys['KeyD']) player.x += player.speed;
            if (keys['ArrowUp'] || keys['KeyW']) player.y -= player.speed;
            if (keys['ArrowDown'] || keys['KeyS']) player.y += player.speed;

            // Touch / Mouse smooth follow
            if (player.isDragging) {
                player.x += (player.targetX - player.x) * 0.15;
                player.y += (player.targetY - player.y) * 0.15;
            }

            // Boundary clamping
            player.x = Math.max(player.radius, Math.min(canvas.width - player.radius, player.x));
            player.y = Math.max(player.radius, Math.min(canvas.height - player.radius, player.y));

            // Shield timer countdown
            if (shieldActive) {
                shieldTimer--;
                if (shieldTimer <= 0) shieldActive = false;
            }

            // Update Stars
            for (let i = stars.length - 1; i >= 0; i--) {
                let s = stars[i];
                s.y += s.speed;
                s.angle += 0.05;

                // Collision with player
                let dist = Math.hypot(player.x - s.x, player.y - s.y);
                if (dist < player.radius + s.size) {
                    score += 1;
                    createSparkles(s.x, s.y, '#facc15');
                    addFloatText("+1 ⭐", s.x, s.y, '#facc15');
                    stars.splice(i, 1);
                    continue;
                }
                if (s.y > canvas.height + 40) stars.splice(i, 1);
            }

            // Update Fruits
            for (let i = fruits.length - 1; i >= 0; i--) {
                let f = fruits[i];
                f.y += f.speed;
                f.x += Math.sin(f.y * 0.03) * 0.8;

                let dist = Math.hypot(player.x - f.x, player.y - f.y);
                if (dist < player.radius + 20) {
                    fruitCount += 1;
                    score += 5;
                    createSparkles(f.x, f.y, '#ec4899');
                    addFloatText("+5 🍎", f.x, f.y, '#ec4899');
                    fruits.splice(i, 1);
                    continue;
                }
                if (f.y > canvas.height + 40) fruits.splice(i, 1);
            }

            // Update Clouds (Bounces back or gentle push instead of game over!)
            for (let i = clouds.length - 1; i >= 0; i--) {
                let c = clouds[i];
                c.y += c.speed;

                let dist = Math.hypot(player.x - c.x, player.y - c.y);
                if (dist < player.radius + c.radius - 10) {
                    if (shieldActive) {
                        // Pop cloud with shield
                        createSparkles(c.x, c.y, '#38bdf8');
                        clouds.splice(i, 1);
                        addFloatText("✨ 팡!", c.x, c.y, '#38bdf8');
                    } else {
                        // Gentle bounce away and minor visual feedback
                        player.y += 15;
                        createSparkles(player.x, player.y, '#ffffff');
                        addFloatText("앗! 몽실구름", player.x, player.y - 20, '#94a3b8');
                        // Temporary visual knockback
                    }
                    continue;
                }
                if (c.y > canvas.height + 60) clouds.splice(i, 1);
            }

            // Update Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.alpha -= 0.03;
                if (p.alpha <= 0) particles.splice(i, 1);
            }

            // Update Floating Texts
            for (let i = floatTexts.length - 1; i >= 0; i--) {
                let ft = floatTexts[i];
                ft.y -= 1;
                ft.alpha -= 0.02;
                if (ft.alpha <= 0) floatTexts.splice(i, 1);
            }
        }

        function createSparkles(x, y, color) {
            for (let i = 0; i < 8; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 5,
                    vy: (Math.random() - 0.5) * 5,
                    radius: 3 + Math.random() * 4,
                    color: color,
                    alpha: 1
                });
            }
        }

        function addFloatText(text, x, y, color) {
            floatTexts.push({ text, x, y, alpha: 1, color });
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw Background Sky Gradient & Soft Sunbeams
            let gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            gradient.addColorStop(0, '#bae6fd');
            gradient.addColorStop(0.5, '#e0f2fe');
            gradient.addColorStop(1, '#fbcfe8');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw Background Soft Background Clouds
            ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
            ctx.beginPath();
            ctx.arc(80, 150, 40, 0, Math.PI * 2);
            ctx.arc(360, 380, 50, 0, Math.PI * 2);
            ctx.arc(120, 520, 45, 0, Math.PI * 2);
            ctx.fill();

            // Draw Clouds (Obstacles)
            clouds.forEach(c => {
                ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
                ctx.strokeStyle = '#e0f2fe';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(c.x, c.y, c.radius, 0, Math.PI * 2);
                ctx.arc(c.x - c.radius * 0.5, c.y + 10, c.radius * 0.7, 0, Math.PI * 2);
                ctx.arc(c.x + c.radius * 0.5, c.y + 10, c.radius * 0.7, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                // Cute little smiley face on cloud
                ctx.fillStyle = '#64748b';
                ctx.beginPath();
                ctx.arc(c.x - 10, c.y - 5, 4, 0, Math.PI * 2);
                ctx.arc(c.x + 10, c.y - 5, 4, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(c.x, c.y + 5, 6, 0, Math.PI);
                ctx.stroke();
            });

            // Draw Stars
            stars.forEach(s => {
                ctx.save();
                ctx.translate(s.x, s.y);
                ctx.rotate(s.angle);
                ctx.fillStyle = '#facc15';
                ctx.strokeStyle = '#ca8a04';
                ctx.lineWidth = 2;
                ctx.beginPath();
                for (let i = 0; i < 5; i++) {
                    ctx.lineTo(Math.abs(Math.cos((i * 2) * Math.PI / 5)) * s.size, Math.abs(Math.sin((i * 2) * Math.PI / 5)) * s.size);
                    ctx.lineTo(Math.abs(Math.cos((i * 2 + 1) * Math.PI / 5)) * (s.size / 2), Math.abs(Math.sin((i * 2 + 1) * Math.PI / 5)) * (s.size / 2));
                }
                ctx.closePath();
                ctx.fill();
                ctx.stroke();
                ctx.restore();
            });

            // Draw Fruits
            fruits.forEach(f => {
                ctx.font = '28px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(f.type, f.x, f.y);
            });

            // Draw Player (Cute Little Airplane)
            ctx.save();
            ctx.translate(player.x, player.y);

            // Shield Bubble
            if (shieldActive) {
                ctx.fillStyle = 'rgba(56, 189, 248, 0.3)';
                ctx.strokeStyle = '#38bdf8';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(0, 0, player.radius + 12, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
            }

            // Airplane Body (Pink & Yellow pastel cute design)
            // Wings
            ctx.fillStyle = '#f472b6';
            ctx.beginPath();
            ctx.ellipse(0, 0, 32, 12, 0, 0, Math.PI * 2);
            ctx.fill();

            // Fuselage
            ctx.fillStyle = '#fbbf24';
            ctx.beginPath();
            ctx.arc(0, 0, 18, 0, Math.PI * 2);
            ctx.fill();

            // Cockpit Window
            ctx.fillStyle = '#38bdf8';
            ctx.beginPath();
            ctx.arc(0, -4, 9, 0, Math.PI * 2);
            ctx.fill();

            // Cute Propeller at front
            ctx.fillStyle = '#94a3b8';
            ctx.fillRect(-3, -24, 6, 10);

            ctx.restore();

            // Draw Sparkles Particles
            particles.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.alpha;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1.0;
            });

            // Draw Floating Texts
            floatTexts.forEach(ft => {
                ctx.save();
                ctx.font = 'bold 18px Jua, sans-serif';
                ctx.fillStyle = ft.color;
                ctx.globalAlpha = ft.alpha;
                ctx.textAlign = 'center';
                ctx.fillText(ft.text, ft.x, ft.y);
                ctx.restore();
            });

            // Draw Scoreboard HUD on Canvas Top
            ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
            ctx.roundRect(15, 15, 140, 45, 15);
            ctx.fill();

            ctx.fillStyle = '#d97706';
            ctx.font = 'bold 16px Jua, sans-serif';
            ctx.textAlign = 'left';
            ctx.fillText(`⭐ 별: ${score}`, 28, 42);

            ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
            ctx.roundRect(165, 15, 140, 45, 15);
            ctx.fill();

            ctx.fillStyle = '#db2777';
            ctx.fillText(`🍎 과일: ${fruitCount}`, 178, 42);
        }

        // Main Animation Loop
        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        // Start initial frame render
        loop();
    </script>
</body>
</html>
